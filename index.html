<body>

    <h1>Bomberman - GitHub Pages</h1>
    
    <div class="controls-info">
        <div class="p1-info"><strong>Joueur 1 (Bleu) :</strong> ZQSD pour bouger | ESPACE pour poser une bombe</div>

    <canvas id="gameCanvas" width="520" height="440"></canvas>
    
    <h2 id="status"></h2>
